[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-decision-engine"
version = "0.1.0"
description = "Self-hosted AI-assisted security behavior triage in shadow mode"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
security-engine = "security_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/security_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
