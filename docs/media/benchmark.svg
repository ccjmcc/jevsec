<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ee7db1"/>
    <stop offset="100%" stop-color="#f3a2c7"/>
  </linearGradient>
  <style>
    .title{font:700 54px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#141821}
    .sub{font:400 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}
    .axis{font:400 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}
    .label{font:500 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5e6470}
    .value{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d41468}
    .small{font:400 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8b8f98}
    .hero{font:700 54px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#121722}
    .pink{fill:#d41468}
  </style>
</defs>

<rect width="1440" height="900" rx="32" fill="#fbfcfe"/>
<text x="78" y="88" class="title">JevSec vs static rules</text>
<text x="78" y="138" class="sub">250 held-out CSIC replay windows · semi-real benchmark.</text>

<g stroke="#e7e9ee" stroke-width="2" stroke-dasharray="7 8">
  <line x1="170" y1="220" x2="1340" y2="220"/>
  <line x1="170" y1="345" x2="1340" y2="345"/>
  <line x1="170" y1="470" x2="1340" y2="470"/>
  <line x1="170" y1="595" x2="1340" y2="595"/>
  <line x1="170" y1="720" x2="1340" y2="720"/>
</g>

<g class="axis">
  <text x="80" y="228">30%</text>
  <text x="64" y="353">22.5%</text>
  <text x="83" y="478">15%</text>
  <text x="70" y="603">7.5%</text>
  <text x="92" y="728">0%</text>
</g>

<line x1="170" y1="720" x2="1340" y2="720" stroke="#d6dae2" stroke-width="2"/>
<line x1="170" y1="220" x2="170" y2="720" stroke="#d6dae2" stroke-width="2"/>

<!-- 20.69% -->
<rect x="260" y="375.2" width="220" height="344.8" rx="20" fill="url(#bar)"/>
<text x="370" y="352" text-anchor="middle" class="value">20.69%</text>
<text x="370" y="765" text-anchor="middle" class="label">Static rules</text>

<!-- 23.45% -->
<rect x="615" y="329.2" width="220" height="390.8" rx="20" fill="url(#bar)"/>
<text x="725" y="306" text-anchor="middle" class="value">23.45%</text>
<text x="725" y="765" text-anchor="middle" class="label">Local Qwen3</text>

<!-- 26.90% -->
<rect x="970" y="271.7" width="220" height="448.3" rx="20" fill="url(#bar)"/>
<text x="1080" y="248" text-anchor="middle" class="value">26.90%</text>
<text x="1080" y="765" text-anchor="middle" class="label">JevSec Hybrid</text>

<text x="78" y="815" class="small">145 anomalous / 105 normal · Not production performance.</text>
<text x="78" y="872" class="hero"><tspan class="pink">+30%</tspan> more anomalous windows detected</text>
</svg>